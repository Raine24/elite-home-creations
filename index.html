<body class="bg-primary text-secondary antialiased selection:bg-secondary selection:text-primary">

            </div>
            <div class="col-span-1 flex justify-end">
              <button type="button" class="mediumText" data-action="close-mobile-menu">Close</button>
            </div>
          </div>

          <div class="layout-grid">

              <ul class="largeText space-y-[1vw]">
                <li><a href="#/" data-action="close-mobile-menu">Home</a></li>
                <li><a href="#/projects" data-action="close-mobile-menu">Projects</a></li>
                <li><a href="#/studio" data-action="close-mobile-menu">Studio</a></li>

                <li><a href="#/faq" data-action="close-mobile-menu">FAQ</a></li>

            <div class="col-span-6 flex flex-col gap-[1vw]">

                  <div class="group-hover:translate-y-[-0.25vw] transition-transform duration-200 ease-out"><span>(214) 298-0007</span></div>
